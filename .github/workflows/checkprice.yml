name: checkprice keeper

on:
  schedule:
    # Runs every 6 hours. Adjust as you like -- e.g. "0 */2 * * *" for every 2 hours.
    - cron: '0 */6 * * *'
  workflow_dispatch: {}   # lets you also trigger it manually from GitHub's UI

jobs:
  checkprice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - run: node checkprice.js
        env:
          KEEPER_PRIVATE_KEY: ${{ secrets.KEEPER_PRIVATE_KEY }}
