name: checkprice keeper

on:
  schedule:
    # Runs every 5 minutes, matching the contract's own 5-minute cooldown.
    - cron: '*/6 * * * *'
  workflow_dispatch: {}   # lets you also trigger it manually from GitHub's UI

jobs:
  checkprice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - run: node checkprice.js
        env:
          KEEPER_PRIVATE_KEY: ${{ secrets.KEEPER_PRIVATE_KEY }}
